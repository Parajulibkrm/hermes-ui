services:
  # ---------------------------------------------------------------------------
  # Hermes Gateway — core agent runtime & API on :8642
  # ---------------------------------------------------------------------------
  gateway:
    # Custom build that adds full Chromium on top of the base image so browser
    # tools (browser_navigate etc.) work. Base image only ships headless-shell.
    build:
      context: ./gateway
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    image: paperclip-hermes/hermes-gateway:latest
    container_name: hermes-gateway
    command: gateway run
    restart: unless-stopped
    shm_size: 1g
    networks:
      - dokploy-network
    expose:
      - "8642"
    volumes:
      # Bind-mount to Dokploy's managed `../files/` dir (sibling of the compose
      # project). Dokploy preserves this path across redeploys, so config + auth
      # + sessions persist. Shared with the dashboard service.
      - ../files/hermes:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q 8642 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Hermes Dashboard — built-in web UI, served on :9119
  # ---------------------------------------------------------------------------
  dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - dokploy-network
    expose:
      # Internal-only port. Traefik connects on this port across dokploy-network.
      - "9119"
    environment:
      GATEWAY_HEALTH_URL: http://hermes-gateway:8642
    volumes:
      # Same data dir as the gateway so the dashboard sees the same config,
      # auth.json, and sessions.
      - ../files/hermes:/opt/data
    # Explicit Traefik labels — Dokploy's Domains-tab UI sometimes doesn't
    # inject these into Compose-mode services. Setting them here guarantees
    # Traefik routes ${HERMES_DOMAIN} to this service on port 9119.
    # In Swarm mode, Traefik reads labels from `deploy.labels`, not the
    # top-level `labels:` key.
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        - traefik.http.routers.hermes-dashboard.rule=Host(`${HERMES_DOMAIN}`)
        - traefik.http.routers.hermes-dashboard.entrypoints=websecure
        - traefik.http.routers.hermes-dashboard.tls=true
        - traefik.http.routers.hermes-dashboard.tls.certresolver=letsencrypt
        # Basic-auth middleware. Hermes dashboard has no native auth and reads
        # /opt/data which contains API keys, so this is required when exposed
        # publicly. Generate the user:hash with `htpasswd -nb admin yourpw`
        # and put the result in HERMES_DASHBOARD_BASICAUTH.
        - traefik.http.routers.hermes-dashboard.middlewares=hermes-dashboard-auth
        - traefik.http.middlewares.hermes-dashboard-auth.basicauth.users=${HERMES_DASHBOARD_BASICAUTH:-}
        - traefik.http.services.hermes-dashboard.loadbalancer.server.port=9119

networks:
  # External: created by Dokploy at install time. We just join it; we don't
  # define it. If this isn't a Dokploy host, create it once with:
  #   docker network create --driver overlay --attachable dokploy-network
  dokploy-network:
    external: true
