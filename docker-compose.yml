services:
  # ---------------------------------------------------------------------------
  # Hermes Gateway — core agent runtime & API on :8642
  # ---------------------------------------------------------------------------
  gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-gateway
    command: gateway run
    restart: unless-stopped
    shm_size: 1g
    networks:
      - dokploy-network
    expose:
      - "8642"
    volumes:
      # Bind-mount to Dokploy's managed `../files/` dir (sibling of the compose
      # project). Dokploy preserves this path across redeploys, so config + auth
      # + sessions persist. Shared with the dashboard service.
      - ../files/hermes:/opt/data
      # Named volume seeded from the agent image's /opt/hermes (source code,
      # node_modules, venv, AND .playwright/ Chromium binaries). Shared with the
      # webui service so it can `uv pip install` hermes-agent and run browser
      # tools against the same Playwright install. Delete this volume after
      # bumping HERMES_IMAGE to pick up the new agent code on next start.
      - hermes-agent-src:/opt/hermes
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q 8642 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Hermes Dashboard — built-in web UI, served on :9119
  # ---------------------------------------------------------------------------
  dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - dokploy-network
    expose:
      # Internal-only port. Traefik connects on this port across dokploy-network.
      - "9119"
    environment:
      GATEWAY_HEALTH_URL: http://hermes-gateway:8642
    volumes:
      # Same data dir as the gateway so the dashboard sees the same config,
      # auth.json, and sessions.
      - ../files/hermes:/opt/data
    # Explicit Traefik labels — Dokploy's Domains-tab UI sometimes doesn't
    # inject these into Compose-mode services. Setting them here guarantees
    # Traefik routes ${HERMES_DOMAIN} to this service on port 9119.
    # In Swarm mode, Traefik reads labels from `deploy.labels`, not the
    # top-level `labels:` key.
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        - traefik.http.routers.hermes-dashboard.rule=Host(`${HERMES_DOMAIN}`)
        - traefik.http.routers.hermes-dashboard.entrypoints=websecure
        - traefik.http.routers.hermes-dashboard.tls=true
        - traefik.http.routers.hermes-dashboard.tls.certresolver=letsencrypt
        # Basic-auth middleware. Hermes dashboard has no native auth and reads
        # /opt/data which contains API keys, so this is required when exposed
        # publicly. Generate the user:hash with `htpasswd -nb admin yourpw`
        # and put the result in HERMES_DASHBOARD_BASICAUTH.
        - traefik.http.routers.hermes-dashboard.middlewares=hermes-dashboard-auth
        - traefik.http.middlewares.hermes-dashboard-auth.basicauth.users=${HERMES_DASHBOARD_BASICAUTH:-}
        - traefik.http.services.hermes-dashboard.loadbalancer.server.port=9119

  # ---------------------------------------------------------------------------
  # Community Hermes WebUI (nesquena/hermes-webui) — alternative chat UI on :8787
  # ---------------------------------------------------------------------------
  webui:
    # Custom build that adds Chromium runtime libraries on top of the upstream
    # nesquena/hermes-webui image. The Playwright Chromium binary itself is
    # provided by the gateway image via the shared `hermes-agent-src` volume.
    build:
      context: ./webui
    image: paperclip-hermes/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    shm_size: 2g
    depends_on:
      - gateway
    networks:
      - dokploy-network
    expose:
      - "8787"
    # Run as the image's built-in `hermeswebui` user (uid 10000), which already
    # matches the gateway image's `hermes` user. Do NOT set WANTED_UID/WANTED_GID
    # — when those equal an existing in-image uid, docker_init.bash creates a
    # sidecar user at a different uid (e.g. `hermeswebuitoo` at 1025), which
    # then can't traverse /home/hermeswebui (mode 700, owned by uid 10000) and
    # so can't see the shared Playwright Chromium binaries from the gateway.
    user: "10000:10000"
    environment:
      # Required by docker_init.bash — refuses to start if unset.
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui-mvp
      # Point Playwright at the Chromium install shipped inside the gateway
      # image (mounted at /home/hermeswebui/.hermes/hermes-agent via the shared
      # named volume below).
      PLAYWRIGHT_BROWSERS_PATH: /home/hermeswebui/.hermes/hermes-agent/.playwright
      # Optional — set in .env to password-protect the WebUI.
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}
    volumes:
      # Same data dir as gateway/dashboard so all three see the same config,
      # auth.json, and sessions.
      - ../files/hermes:/home/hermeswebui/.hermes
      # Shared with gateway: agent source code + Playwright Chromium browsers.
      # Mounted where docker_init.bash looks for hermes-agent (so it pip-installs
      # from here) and where PLAYWRIGHT_BROWSERS_PATH expects the binaries.
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      # Workspace dir the WebUI exposes for agent file ops. Persisted via
      # Dokploy's managed `../files/` like the hermes data dir.
      - ../files/workspace:/workspace
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        - traefik.http.routers.hermes-webui.rule=Host(`${HERMES_WEBUI_DOMAIN}`)
        - traefik.http.routers.hermes-webui.entrypoints=websecure
        - traefik.http.routers.hermes-webui.tls=true
        - traefik.http.routers.hermes-webui.tls.certresolver=letsencrypt
        - traefik.http.services.hermes-webui.loadbalancer.server.port=8787

networks:
  # External: created by Dokploy at install time. We just join it; we don't
  # define it. If this isn't a Dokploy host, create it once with:
  #   docker network create --driver overlay --attachable dokploy-network
  dokploy-network:
    external: true

volumes:
  # Auto-populated from the gateway image's /opt/hermes on first start: hermes
  # source, node_modules, Python venv, and .playwright/ Chromium binaries.
  # Shared with the webui so it can run hermes-agent and browser tools.
  hermes-agent-src:
